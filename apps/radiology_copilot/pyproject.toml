[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futurekind-radiology-copilot"
description = "FutureKind Radiology Copilot — the first clinical application built on the FutureKind platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# Application version is independent of the platform version: this product moves
# at the pace of its clinical review, not the pace of the Gateway.
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
futurekind-radiology-copilot = "futurekind_radiology.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/futurekind_radiology/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/futurekind_radiology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
