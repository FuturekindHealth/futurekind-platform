  # ------------------------------------------------------------ normal (15)
  - id: N-01
    modality: CT
    study: CT HEAD WITHOUT CONTRAST
    category: normal
    difficulty: 1
    indication: 62-year-old, sudden right hemiparesis, onset 2 hours
    dictated: >-
      No haemorrhage. Preserved grey-white differentiation. No loss of the insular
      ribbon. No midline shift. Ventricles and sulci normal for age.
    expected_findings: No acute intracranial abnormality on non-contrast imaging.
    expected_impression: No acute haemorrhage. Early ischaemic change not excluded.
    expected_recommendation: Clinical correlation; consider CT angiography and perfusion within the intervention window.
    teaching_points: A normal CT head in hyperacute stroke is a decision, not an absence of news.
    must_not_say: [no infarct, normal study therefore no stroke, exclude large-vessel occlusion]
    ratified: pending

