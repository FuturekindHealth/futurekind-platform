  - id: E-01
    modality: CT
    study: CT HEAD WITHOUT CONTRAST
    category: emergency
    difficulty: 3
    indication: 58-year-old, sudden severe headache with vomiting, declining consciousness
    dictated: >-
      Large hyperdense collection in the left basal ganglia and internal capsule,
      4.5 cm maximum, with intraventricular extension filling the lateral and third
      ventricles. Surrounding hypodense oedema, effacement of the left lateral
      ventricle, rightward midline shift 9 mm, subfalcine herniation. Basal cisterns
      compressed.
    expected_findings: Hypertensive ganglia haemorrhage with intraventricular extension and mass effect.
    expected_impression: Large left basal ganglia haemorrhage with intraventricular extension, 9 mm shift and subfalcine herniation; obstructive hydrocephalus threatened.
    expected_recommendation: Immediate neurosurgical review; blood pressure control and anticoagulation reversal; consider EVD if consciousness deteriorates.
    teaching_points: The shift, the cisterns and the ventricular blood are the three numbers the surgeon acts on.
    must_not_say: [conservative management, stable, small haematoma]
    ratified: pending

  - id: E-02
