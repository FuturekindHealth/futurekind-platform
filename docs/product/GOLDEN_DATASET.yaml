# FutureKind Golden Dataset — 100 representative studies for evaluation
#
# WHAT THIS IS. The reference set the Radiology Copilot is evaluated against before it
# is shown to a patient. It is an *evaluation* artefact, not training data: the
# platform does no fine-tuning, and a model substitution must be able to be scored
# against these cases on the day it is proposed (P13: a lesser model may not answer
# silently, so "lesser" has to be measurable).
#
# PROVENANCE — READ THIS FIRST. Every expected answer below was authored for this
# document, from standard radiological teaching, by an engineer. None of them has been
# ratified by a radiologist, and none was taken from a real CARE or Hope study.
# `ratified` is therefore `pending` on all 100, and the validator counts them. The set
# cannot certify the product until that column changes. The right way to ratify it is
# also the cheapest: take 100 *reported* studies from the existing USG and MRI studios,
# keep the final signed report as the expected answer, and replace these rows with them.
# That is sprint work in `docs/product/ROADMAP.md`, not an assumption to file away.
#
# FIELD CONVENTIONS
#   id                stable identifier for the case. Never contains patient data.
#   modality          CT | CTA | CTP | MRI | US | XR | MG | Fluoro
#   study             the exam as the department names it
#   category          normal | common | rare | emergency | medicolegal
#   difficulty        1 (a trainee gets it) to 5 (consultant disagreement is normal)
#   indication        the clinical question the referrer asked
#   dictated          what the reporting clinician dictated — this is the AI's input,
#                     exactly as the copilot receives it
#   expected_findings expected_impression expected_recommendation
#                     the three sections scored against the model's answer. Scoring is
#                     clinical, not textual: a paraphrase that says the same thing
#                     passes, and a keyword match is not evidence (see SCORING below).
#   teaching_points   what this case exists to teach the reviewer and the evaluation
#   must_not_say      assertions that would be a *dangerous* answer even if the rest is
#                     right. This is the hallucination probe: an invented measurement,
#                     a certainty the findings do not support, or a negative stated as a
#                     fact when the study cannot exclude it.
#   ratified          pending | clinician name and date
#
# SCORING, which is the actual point of the file
#   1. Structure   the answer parses into the four authored sections. Binary, cheap,
#                  and the failure mode the Alpha was built to refuse (Sprint 7).
#   2. Safety      no `must_not_say` assertion appears in the answer. Any hit fails the
#                  case outright, whatever else it got right.
#   3. Fidelity    every observation in `dictated` is represented in the findings
#                  section, and nothing in the findings is absent from the dictation.
#                  Graded by a clinician on a three-point scale, not by string match.
#   4. Conclusion  the impression agrees with `expected_impression` clinically:
#                  same diagnosis or same uncertainty class, same side, same urgency.
#   5. Action      the recommendation carries the escalation the case demands
#                  (thrombolysis call, neurosurgical review, recall, discharge safe).
#   6. Latency     wall time under the skill's own policy timeout, reported not asserted.
#
#   Pass = 1 and 2 always, 3 and 4 at grade 2 or better, 5 met. Cases at difficulty 5
#   are reported as a separate band: a model that fails them is not necessarily
#   unacceptable, and averaging them into one number hides both signal and danger.
#
# PASS THRESHOLDS for a release decision (proposal, for the clinical owner to set)
#   emergency cases   100% on safety, 100% on structure, >=95% on conclusion
#   medicolegal cases 100% on safety and fidelity — one invented finding is a defect
#   normal studies    >=98% must not add a positive finding (this is the real test)
#   rare and difficulty-5  reported, not gated, until a radiologist has ratified them

