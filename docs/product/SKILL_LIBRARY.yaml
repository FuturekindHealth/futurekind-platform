    status: alpha
    example_request: 'skill=notifiable-disease-report; "typhoid confirmed, blood culture positive, onset 6 days"'
    example_response: 'impression "Notify state health authority within 24 hours; fields complete, clinician to sign."'

  - id: healthcare-associated-infection-review
    purpose: Review whether an infection arose during a stay, against the surveillance definition.
    inputs: admission date, culture dates, device history, unit antimicrobial use
    outputs: community versus healthcare-associated classification with the criterion used
    risk: moderate
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=healthcare-associated-infection-review; " urine culture day 6, catheter day 2"'
    example_response: 'impression "Meets CAUTI surveillance definition. Report to infection control committee."'

  # ---------------------------------------------------------------- 19. cardiopulmonary and neurophysiology (5)
  - id: echocardiogram-report
    purpose: Draft a transthoracic echocardiogram report from the measurements the sonographer recorded.
    inputs: chamber sizes, ejection fraction method, valve findings, diastolic parameters, IVC
    outputs: an integrated impression answering the clinical question asked
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=echocardiogram-report; "EF 32% biplane, severe MR, E/e 18, PASP 46"'
    example_response: 'impression "Reduced EF with severe MR and raised filling pressures. Heart-failure pathway."'

  - id: holter-arrhythmia-summary
    purpose: Summarise ambulatory rhythm monitoring into burden, episodes and symptom correlation.
    inputs: total beats, arrhythmia episodes, longest pause, burden percentages, symptom log
    outputs: a monitored-rhythm impression with the clinical decision it supports
    risk: high
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=holter-arrhythmia-summary; "AF burden 18%, longest 4 min, 3 palpitation episodes correlated"'
    example_response: 'impression "Paroxysmal AF with 18% burden, symptomatic — anticoagulation decision."'

  - id: spirometry-report
    purpose: Draft a spirometry report with a bronchodilator response interpretation.
    inputs: FVC, FEV1, ratio, predicted percentages, post-bronchodilator change
    outputs: pattern, severity grade and reversibility statement
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=spirometry-report; "FEV1/FVC 0.58, FEV1 52% predicted, +14% and 220 mL after salbutamol"'
    example_response: 'impression "Moderate obstructive defect with significant reversibility — asthma."'

  - id: sleep-study-summary
    purpose: Summarise a polysomnography study with severity and the therapy it mandates.
    inputs: AHI, minimum saturation, arousals, sleep efficiency, position and REM dependence
    outputs: severity classification with titration or device recommendation
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=sleep-study-summary; "AHI 41, nadir SpO2 72%, 82% of events REM-related"'
    example_response: 'impression "Severe OSA, predominant desaturation in REM. CPAP therapy indicated."'

  - id: eeg-report
    purpose: Draft an EEG report from the background activity and any recorded events.
    inputs: state, background rhythm, reactivity, epileptiform findings, clinical events
    outputs: an interpretation with the pattern that answers the referral question
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=eeg-report; "left temporal periodic lateralised epileptiform discharges, slow background"'
    example_response: 'impression "Left temporal LPDs with dysfunction — correlate with acute pathology."'

  # ---------------------------------------------------------------- 20. oncology and multidisciplinary tumour board (5)
  - id: tumour-board-summary
    purpose: Produce the multidisciplinary tumour board record from the case presentation.
    inputs: pathology, imaging stage, performance status, options discussed, consensus decision
    outputs: a dated board summary with the agreed plan and who carries it out
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: beta
    blocked_by: ADR-0005 — a board decision binds several clinicians to one plan; the record must show who decided, platform-side, not in a note
    example_request: 'skill=tumour-board-summary; "rectal CA cT3N1, consensus neoadjuvant chemoradiotherapy"'
    example_response: 'impression "Plan: long-course chemoradiotherapy, restage 8 weeks, then surgery."'

  - id: tumour-staging-note
    purpose: Assemble a TNM staging note from pathology, imaging and clinical findings.
    inputs: primary tumour descriptors, nodal status, metastatic findings, histology grade
    outputs: a staging line with each component traced to the finding that supports it
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=tumour-staging-note; "pT3 N1 2/18, no distant disease on CT chest abdomen"'
    example_response: 'impression "Stage IIIB (pT3 N1b M0), moderately differentiated."'

  - id: oncology-treatment-plan
    purpose: Draft the staged treatment plan a patient and their family can be talked through.
    inputs: stage, performance status, comorbidity, protocol options, intended intent
    outputs: a sequenced plan with the monitoring and the decision points inside it
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: beta
    blocked_by: ADR-0005 — a treatment plan is the clinical act that consent attaches to
    example_request: 'skill=oncology-treatment-plan; "stage IIIB rectal CA, CRT then TME, adjuvant CAPOX"'
    example_response: 'impression "Plan sequenced with restaging and toxicity checkpoints named."'

  - id: survivorship-care-plan
    purpose: Produce the end-of-treatment survivorship plan with surveillance and late effects.
    inputs: treatment received, date completed, residual toxicities, recurrence risk
    outputs: a surveillance schedule, late-effect list and the who-calls-whom instruction
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=survivorship-care-plan; "completed chemoRT and surgery, grade 2 neuropathy"'
    example_response: 'impression "CT surveillance 3-monthly for 2 years; CEA; neuropathy review; bowel function clinic."'

  - id: palliative-care-plan
    purpose: Draft a symptom-control and goals-of-care plan for advanced disease.
    inputs: symptom burden, current medicines, functional status, patient wishes, carer situation
    outputs: a symptom plan with escalation thresholds and the goals-of-care statement
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=palliative-care-plan; "breast CA with bone and liver metastases, pain 7/10, dyspnoea"'
    example_response: 'impression "Opioid rotation with breakthrough doses; breathlessness pathway; DNAR discussion offered."'

  # ---------------------------------------------------------------- 21. medication safety (5)
  - id: drug-interaction-review
    purpose: Review a medication list for interactions that change what is prescribed today.
    inputs: current medicines with doses, renal and hepatic function, allergies
    outputs: interaction list graded by consequence, with the substitution proposed
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=drug-interaction-review; "warfarin, clarithromycin started yesterday, carbamazepine"'
    example_response: 'impression "Major: clarithromycin raises INR — change antibiotic or reduce and check INR in 48 h."'

  - id: renal-and-hepatic-dose-adjustment
    purpose: Adjust a dose to measured organ function and say what to monitor afterwards.
    inputs: drug, eGFR or Child-Pugh class, weight, indication, planned duration
    outputs: the adjusted dose, the interval, and the monitoring rule
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=renal-and-hepatic-dose-adjustment; "piperacillin-tazobactam, eGFR 22"'
    example_response: 'impression "Reduce to 4.5 g every 8 hours; reassess daily; review levels if available."'

  - id: high-alert-medication-check
    purpose: Run the double-check required before a high-alert drug is given.
    inputs: drug, concentration, dose, route, rate, indication, second checker
    outputs: a checklist result with any field that could not be verified left unresolved
    risk: critical
    approval: required
    audit: true
    capability: fast
    status: alpha
    example_request: 'skill=high-alert-medication-check; "insulin infusion 50 units in 50 mL, protocol rate 4 mL/h"'
    example_response: 'impression "Concentration and rate verified; second checker field blank — do not start until signed."'

  - id: antimicrobial-stewardship-review
    purpose: Review an antimicrobial prescription for indication, spectrum, dose and duration.
    inputs: organism and sensitivities, site, current regimen, day of therapy
    outputs: continue, narrow, escalate or stop, with the day the decision must be revisited
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=antimicrobial-stewardship-review; "day 5 pip-tazo, culture E coli sensitive to ceftriaxone"'
    example_response: 'impression "De-escalate to ceftriaxone; stop date day 7; review at 48 hours."'

  - id: pregnancy-and-lactation-drug-safety
    purpose: Assess a prescribed or requested medicine against pregnancy and lactation.
    inputs: gestation or lactation status, drug and dose, indication, alternatives considered
    outputs: a category-consistent recommendation with the counselling point for the clinician
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: beta
    blocked_by: ADR-0005 — this output is given to a pregnant patient as advice; a platform-verifiable signature is required before that
    example_request: 'skill=pregnancy-and-lactation-drug-safety; "valproate, 9 weeks pregnant, epilepsy controlled"'
    example_response: 'impression "Do not stop abruptly — neurology same week; folate high dose; documented risk counselling."'

  # ---------------------------------------------------------------- 22. clinical documentation and medicolegal (5)
  - id: discharge-summary
    purpose: Draft the discharge summary that carries an admission into the community.
    inputs: diagnosis list, procedures, medicines at discharge, investigations, follow-up plan
    outputs: a complete summary with any missing section flagged as a gap, not a blank
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=discharge-summary; "day 6 heart failure decompensation, diuresed 4 L, GDMT started"'
    example_response: 'impression "Discharge summary drafted; weight and diuretic plan included; echo follow-up date missing."'

  - id: referral-letter
    purpose: Turn a clinician's request into a referral letter that tells the specialist what to do.
    inputs: reason for referral, relevant history, examination, current medicines, question asked
    outputs: a one-page letter whose final line is the explicit question
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=referral-letter; "progressive dysphagia, lost 8 kg, question: is there a surgical lesion"'
    example_response: 'impression "Referred to surgical gastroenterology for urgent upper GI endoscopy."'

  - id: medicolegal-case-summary
    purpose: Assemble the medico-legal record for a case that may be examined or litigated.
    inputs: presentation time, consent history, findings, treatment, medico-legal formalities
    outputs: a chronologically complete record with every gap in the chain of custody named
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: beta
    blocked_by: ADR-0003 — an evidentiary record needs retention, immutability and export the platform cannot yet guarantee
    example_request: 'skill=medicolegal-case-summary; "assault, 02:10 presentation, consent for examination withheld"'
    example_response: 'impression "Chronology drafted; injury description with body map; consent gap recorded; police intimation pending."'

  - id: medical-certification-draft
    purpose: Draft a certificate of illness, fitness or cause of death in the statutory format.
    inputs: statutory fields, clinical basis, examination or treatment facts
    outputs: the certificate text with the clinician's declaration separated from the AI draft
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: beta
    blocked_by: ADR-0005 and ADR-0003 — a certificate is a legal instrument; both the signature and its retention are platform obligations
    example_request: 'skill=medical-certification-draft; "cause of death, sepsis from decubitus ulcer, 3 weeks"'
    example_response: 'impression "Part I sepsis, underlying decubitus ulcer; opinion fields left for the signing doctor."'

  - id: fitness-for-duty-assessment
    purpose: Assess fitness for a specific duty — driving, machinery, diving, flying — against findings.
    inputs: condition, treatment, duty class, statutory standard cited
    outputs: fit, fit with restriction or unfit, with the standard that decided it
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=fitness-for-duty-assessment; "epilepsy seizure-free 10 months, question: private driving licence"'
    example_response: 'impression "Not fit to drive — seizure-free interval short of standard. Clinician to confirm."'

  # ---------------------------------------------------------------- 23. coding, billing and quality (5)
  - id: icd10-coding-suggestion
    purpose: Suggest diagnosis codes from a completed clinical document, with the evidence quoted.
    inputs: final diagnosis list, procedure list, discharge summary text
    outputs: candidate codes each tied to the sentence that supports it, and any ambiguous case
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=icd10-coding-suggestion; "type 2 diabetes with CKD stage 4, documented"'
    example_response: 'impression "E11.22 suggested — supports combination coding; verify CKD stage is documented."'

  - id: procedure-coding-suggestion
    purpose: Suggest procedure codes for operations and interventions performed.
    inputs: operative notes, approach, laterality, implants, anesthesia time
    outputs: code candidates plus any component that is bundled and should not be billed alone
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=procedure-coding-suggestion; "laparoscopic cholecystectomy with intraoperative cholangiogram"'
    example_response: 'impression "Primary code plus cholangiogram add-on; unbundling risk flagged."'

  - id: prior-authorisation-letter
    purpose: Draft the clinical justification an insurer or scheme asks for before approving a treatment.
    inputs: requested item, diagnosis, prior lines tried, guideline or evidence cited, urgency
    outputs: a justification letter with each assertion traceable to the record
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=prior-authorisation-letter; "tocilizumab in rheumatoid arthritis after two DMARD failures"'
    example_response: 'impression "Justification drafted; prior failures and DAS28 values listed with dates."'

  - id: claim-appeal-draft
    purpose: Draft an appeal against a denied or reduced claim on clinical grounds.
    inputs: denial reason, billed items, record excerpts, policy clause quoted by the payer
    outputs: an appeal that answers the payer clause point by point with evidence
    risk: moderate
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=claim-appeal-draft; "denied as not medically necessary; patient hypoxaemic on day 2"'
    example_response: 'impression "Appeal cites documented hypoxaemia and observed-level criteria; attachments listed."'

  - id: quality-indicator-audit
    purpose: Score a case against a quality indicator and name the record gap when it cannot be scored.
    inputs: indicator definition, case record, dates and thresholds
    outputs: met or not met with the specific data element that decided it
    risk: low
    approval: not-required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=quality-indicator-audit; "door-to-balloon target, cath lab arrival and wire times"'
    example_response: 'impression "Not met: 96 minutes; decision element is the ECG-to-arrival interval."'

  # ---------------------------------------------------------------- 24. patient-facing communication (5)
  - id: patient-explainer
    purpose: Explain a diagnosis or result to a patient in language they can act on.
    inputs: clinical result, patient reading level and language, questions they asked
    outputs: a short explanation with the numbers kept, the jargon removed, and no advice invented
    risk: high
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=patient-explainer; "HbA1c 72 mmol/mol, patient asked whether insulin is coming"'
    example_response: 'impression "Explains the number in percent terms, what changed, and what the plan tests."'

  - id: plain-language-report
    purpose: Convert a signed clinical report into a patient-readable version of the same findings.
    inputs: signed report text, patient language preference
    outputs: a readable version that never adds or removes a clinical fact
    risk: high
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=plain-language-report; "signed MRI: disc extrusion compressing the S1 root"'
    example_response: 'impression "The disc in your lower back is pressing on the nerve that goes down your left leg."'

  - id: pre-procedure-instructions
    purpose: Send the preparation instructions a specific procedure requires.
    inputs: procedure, sedation type, comorbidity and medicines, appointment time
    outputs: instruction sheet with the stop-times for medicines and the arrival deadline
    risk: moderate
    approval: required
    audit: true
    capability: fast
    status: alpha
    example_request: 'skill=pre-procedure-instructions; "colonoscopy with sedation, on lisinopril and metformin"'
    example_response: 'impression "Bowel prep schedule, nil by mouth from 06:00, metformin held, escort required."'

  - id: fasting-and-medication-instruction
    purpose: Give the fasting interval and morning-medication decision for an anaesthetic.
    inputs: procedure time, age, comorbidity, medicine list, pregnancy status
    outputs: the fasting clock and a per-drug take-or-hold line
    risk: high
    approval: required
    audit: true
    capability: fast
    status: alpha
    example_request: 'skill=fasting-and-medication-instruction; "10:30 list, on ramipril, ferrous sulphate, asthma inhaler"'
    example_response: 'impression "Clear fluids until 08:30; ramipril held; inhaler and iron as usual."'

  - id: appointment-preparation-brief
    purpose: Prepare a patient so a consultation is useful the first time.
    inputs: specialty, what will be examined, records to bring, expected duration
    outputs: a short brief listing what to bring and what will happen
    risk: low
    approval: not-required
    audit: false
    capability: fast
    status: alpha
    example_request: 'skill=appointment-preparation-brief; "neurology follow-up, bring seizure diary and past scans"'
    example_response: 'impression "Bring the diary, all imaging discs, current medicine strips; allow 40 minutes."'

  # ---------------------------------------------------------------- 25. knowledge and grounding (3)
  - id: guideline-citation
    purpose: Cite the local or national guideline that a clinical statement relies on.
    inputs: statement to ground, guideline corpus available in the installation
    outputs: the citation with its section, or a refusal when the corpus holds nothing
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: blocked
    blocked_by: ADR-0006 and SPEC-08-06 — no retrieval or citation capability exists; services/knowledge and Qdrant are present in compose but nothing reads them
    example_request: 'skill=guideline-citation; "statement: offer thrombectomy up to 24 hours in selected patients"'
    example_response: 'impression "Cited: local stroke pathway section 4.2; no external corpus consulted."'

  - id: prior-study-comparison
    purpose: Compare a study against the named prior study and describe only what changed.
    inputs: current findings, prior report text, interval since it
    outputs: a change statement — resolved, stable, new, progressed — per lesion
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=prior-study-comparison; "prior 24 mm liver lesion; now 18 mm; new 6 mm lesion segment 6"'
    example_response: 'impression "Target lesion responded 24 to 18 mm; one new 6 mm lesion — mixed response."'

  - id: differential-diagnosis-check
    purpose: Test a draft impression against alternatives the findings could equally support.
    inputs: findings, impression, patient context
    outputs: named alternatives with the finding that argues for each and what would settle it
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=differential-diagnosis-check; "ring-enhancing lesion, 3.1 cm, left frontal, immunocompetent"'
    example_response: 'impression "Differential also includes abscess and metastasis; suggest diffusion and chest imaging."'

  # ---------------------------------------------------------------- 26. analytics and operations (3)
  - id: cohort-extraction
    purpose: Build a de-identified patient cohort for audit, service planning or research.
    inputs: inclusion and exclusion criteria as clinical concepts, date range
    outputs: counts and a de-identified extract, with the criterion each patient met
    risk: moderate
    approval: required
    audit: true
    capability: reasoning
    status: blocked
    blocked_by: ADR-0007 — no Hospital or Patient Context identifier exists, so a cohort cannot be assembled without inventing one; DOMAIN_MODEL Q1 and Q2
    example_request: 'skill=cohort-extraction; "all ischaemic strokes thrombolysed in 2026, by door-to-needle time"'
    example_response: 'impression "62 cases, door-to-needle median 41 min; identifiers withheld from export."'

  - id: de-identification-review
    purpose: Check a proposed data export for identifiers and free-text leakage before it leaves the hospital.
    inputs: the dataset or text, the recipient purpose, allowed identifier list
    outputs: a pass or a list of every field and sentence that must be removed
    risk: high
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=de-identification-review; "research extract, recipient outside the hospital"'
    example_response: 'impression "Fail: 3 free-text notes contain names; dates precise to the day in 41 rows."'

  - id: turnaround-time-brief
    purpose: Explain why a reporting queue is slow, from the timestamps that exist.
    inputs: study timestamps by stage, reporting list, modifier and addendum dates
    outputs: the stage carrying the delay, with the count of studies stuck in it
    risk: low
    approval: not-required
    audit: false
    capability: fast
    status: alpha
    example_request: 'skill=turnaround-time-brief; "week 40, MRI queue median 3 days"'
    example_response: 'impression "Delay sits between scan and list allocation, not in reporting: 21 studies unallocated."'

