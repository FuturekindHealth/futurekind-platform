# FutureKind Healthcare Skill Library — design catalogue, 121 skills
#
# THE COUNT. The brief asked for 100. Designing them against the two named
# deployments (CARE Diagnostics, Hope Neurotrauma) and the workflows already running
# in their systems produced 120 real, non-duplicate intents, and Sprint 8 added a
# 121st that the customer was already running. Cutting a dozen to reach a round
# number would have thrown away reviewed work, so the count is what the work is.
# What `status` says, measured from this file: 110 alpha, 9 beta, 2 blocked. Six
# are authorised in code, and that is the only number that describes what the
# platform does today — read the other 115 as decisions already taken about work
# that has not been authorised.
#
# THE FINDING THAT MATTERS MORE THAN THE COUNT. Every one of the 121 runs on the three
# capabilities that exist today — `default`, `fast`, `reasoning`. Not one needs
# `vision`, because the product principle is that the AI drafts from what the reporting
# clinician dictates, not from the pixels (see
# `docs/product/RADIOLOGY_WORKFLOW.md`). A hundred-plus clinical skills is therefore a
# configuration and review problem, not a platform capability problem: the blockers are
# decisions (ADR-0003, ADR-0005, ADR-0006, ADR-0007), not missing infrastructure.
#
# THE TWENTY LEAST URGENT — a review list, not a field. Nothing in the data below
# marks these; they carry ordinary `status` values like every other entry. They are
# named here because each is administrative, legal or longitudinal rather than a
# document a clinician needs today, and a reader deciding what to authorise next
# should not have to re-derive that judgement from 121 stanzas:
#   pcos-assessment-note, us-obstetric-growth, immunisation-catchup-plan,
#   paediatric-growth-note, paediatric-asthma-action-plan, cervical-screening-report,
#   haematology-bone-marrow-report, sleep-study-summary, fitness-for-duty-assessment,
#   claim-appeal-draft, prior-authorisation-letter, de-identification-review,
#   turnaround-time-brief, differential-diagnosis-check, survivorship-care-plan,
#   palliative-care-plan, oncology-treatment-plan, healthcare-associated-infection-review,
#   procedural-sedation-record, plain-language-report
# The last is a genuine merge candidate: `patient-explainer` and `plain-language-report`
# are one capability seen from two screens, and `DOMAIN_MODEL.md` warns twice about
# naming one act two ways.
#
# WHAT THIS FILE IS. A design catalogue, not runtime configuration. The only skill
# file the platform loads today is `core/gateway/models.yaml` (six skills), and
# nothing here is read by any process. It exists so that a hundred-plus clinical
# intents can be reviewed in one place, in one shape, before any of them becomes
# configuration. When a skill is authorised, it is copied into `models.yaml` by hand
# — one stanza, plus its alias in `configs/litellm/config.yaml`, and the Gateway's
# startup check refuses a half-made change (SPEC-07-03).
#
# WHY THE SHAPE IS FIXED. `docs/DOMAIN_MODEL.md` R1 and ADR-0002 separate five
# namespaces: Skill (what the application is doing), Capability (what class of
# processing serves it), Policy (how carefully it is treated), Alias (what to ask
# LiteLLM for), Model (which weights run). A skill declares the first three and never
# the last two. Nothing in this file names a model, a provider or an endpoint.
#
# FIELD CONVENTIONS
#   id                the string an application puts in `skill`. Kebab-case, verb-ish,
#                     unique. A skill is a request for a document, not a document —
#                     see DOMAIN_MODEL "a Skill is *not* a Report".
#   purpose           one sentence of clinical intent.
#   inputs / outputs  what the request must carry and what the answer must be.
#   risk              low | moderate | high | critical — the operator's judgement, and
#                     `DOMAIN_MODEL` Q6 says every value below is NOT yet ratified by a
#                     clinician. These are proposals for the clinical owner.
#   approval          required | not-required. `required` means a named clinician must
#                     sign the output before it reaches a patient (P3, P11).
#   audit             true | false. Every high or critical skill is forced true, and a
#                     catalogue that declares otherwise fails at startup
#                     (`policy.py:_reject_unsafe_combination`).
#   capability        default | fast | reasoning — the three that exist today.
#                     `vision` and `embedding` are named below and DO NOT EXIST:
#                     `README-ROUTING.md` lists that split as unfinished work, and
#                     `schemas.py` refuses a content-part array with 422 rather than
#                     dropping an image in silence.
#   status            alpha   shippable on today's platform, with approval enforced by
#                             the application (the model Sprint 7 proved).
#                     beta    clinically sound but must wait for platform-verifiable
#                             approval — ADR-0005 (SPECIFICATION §17).
#                     blocked needs a capability or a service that does not exist.
#   blocked_by        the decision or capability that unblocks it. Required when status
#                     is not alpha.
#   example_request   shorthand. Every request is `POST /chat` with
#                     {"skill": <id>, "messages": [system, user]}; only the clinical
#                     payload is shown. A body that names a model is rejected 422.
#   example_response  shorthand of the answer's clinical content, not the wire envelope.
#                     The envelope always adds request_id, model, provider,
#                     selected_by, attempts, degraded, policy and usage
#                     (SPEC-06-09, SPEC-06-10).
#
# EXAMPLES ARE DELIBERATELY SHORT. Expanding 100 verbatim request/response pairs
# would be about 3,000 lines of near-identical JSON that rots the moment the envelope
# changes. Twelve skills carry full examples instead, in
# `docs/product/SKILL_EXAMPLES.md`, and they are the ones a reviewer should read:
# the highest-risk six plus the six with a non-obvious output shape.

version: 1
date: 2026-10-08
owner: clinical owner (unratified — see DOMAIN_MODEL Q6)
deployment_target: CARE Diagnostics and Hope Neurotrauma & Multispeciality Hospital
conventions:
  capabilities_shipped: [default, fast, reasoning]
  capabilities_named_here_but_absent: [vision, embedding]
  approval_meaning: a named clinician signs before the output reaches a patient
  gateway_refuses_approval_required: true   # SPECIFICATION §17, ADR-0005 unwritten

skills:

  # ---------------------------------------------------------------- 1. radiology workflow
  # The umbrella skill plus the five workflow moves that are not a report themselves.
  - id: radiology-report
    purpose: Draft the structured report for any imaging study from the reporting clinician's dictation.
    inputs: clinical indication, modality, study name, dictated findings, optional technique
    outputs: five-section report with provenance, skill and policy attached
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=radiology-report; "62M sudden right hemiparesis 3h; CT head non-contrast: no haemorrhage, lost insular ribbon"'
    example_response: 'findings "…"; impression "No acute haemorrhage. Early left MCA infarct not excluded."'

  - id: radiology-worklist-triage
    purpose: Order the reporting queue so a suspected stroke or bleed is read first.
    inputs: study list with modality, clinical indication and acquisition time
    outputs: ranked list with the reason for each promotion
    risk: moderate
    approval: not-required
    audit: true
    capability: fast
    status: alpha
    example_request: 'skill=radiology-worklist-triage; 14 studies with indications'
    example_response: 'promote #7 (code stroke, 41 min), #12 (suspected bleed); rest by acquisition age'

  - id: radiology-critical-value-alert
    purpose: Decide whether a drafted finding is a critical result that must reach the referring clinician now.
    inputs: findings and impression text, referring clinician, contact route
    outputs: critical yes or no, the sentence that justifies it, and the notification draft
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: beta
    blocked_by: ADR-0005 — a critical result is a clinical act with a time stamp and an owner; it cannot rest on an application-local flag
    example_request: 'skill=radiology-critical-value-alert; "tension pneumothorax, mediastinal shift"'
    example_response: 'critical: true; reason "tension physiology"; notify "Dr Rao, referring, now" draft'

  - id: radiology-second-read-request
    purpose: Ask for a second consultant read on a study the reporting radiologist is not certain about.
    inputs: draft report, the specific uncertainty, target subspecialty
    outputs: a structured referral note to the second reader, with the uncertainty named
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=radiology-second-read-request; "small dural AV fistula suspected, uncertain"'
    example_response: 'to neuroradiology; question "is the early draining vein real on these images"'

  - id: radiology-study-quality-check
    purpose: Flag a study that is technically inadequate for reporting before a radiologist opens it.
    inputs: study description, sequence or projection list, stated clinical question
    outputs: adequacy verdict, what is missing, and a recall recommendation
    risk: moderate
    approval: required
    audit: true
    capability: fast
    status: alpha
    example_request: 'skill=radiology-study-quality-check; "CT lumbar spine, no coronal recon, question: fracture"'
    example_response: 'inadequate: missing coronal recon; recall "yes, same session"'

  - id: usg-advisory-suggestions
    purpose: Propose advisory ultrasound chips — findings, impression, measurement flags, growth notes — for a radiologist to accept or reject one at a time.
    inputs: structured study context (organ list, measurements, prior comparison, section text the workspace chooses to send)
    outputs: a short JSON array of chips, each with kind, section, text, rationale and confidence
    risk: moderate
    approval: required
    audit: true
    capability: fast
    status: alpha
    example_request: 'skill=usg-advisory-suggestions; "gallbladder: two mobile stones 6 mm, wall 2 mm, sonographic Murphy negative"'
    example_response: 'chip impression "Cholelithiasis, no features of acute cholecystitis"; chip measurement_flag "wall 2 mm — normal"'

    # THE ONE SKILL IN THIS FILE THAT CAME FROM THE CUSTOMER INSTEAD OF THE OTHER
    # WAY ROUND. It is not a proposal: the CARE ERP already ran this feature
    # (`usg-reports`-style advisory chips, `lib/ai/usgGatewayProvider.ts`) and
    # Sprint 8 moved it behind the Gateway. `models.yaml` authorises it today with
    # `approval_required: false` — the D4 rule in RADIOLOGY_WORKFLOW.md, because
    # the Gateway refuses a skill that declares it. The accept-only gate is real
    # and lives in the ERP (`routes/usgAi.ts` write-guard, fetal-sex refusal in
    # `usgAiAssistant`), which is what `approval: required` means here.
    # Full migration record: docs/integration/AI_ENTRY_POINTS_CARE_ERP.md

  # ---------------------------------------------------------------- 2. CT (9)
  - id: ct-head-acute-stroke
    purpose: Draft the CT head report for a suspected acute stroke within the intervention window.
    inputs: onset time, deficits, non-contrast CT findings
    outputs: findings, impression with ASPECTS when scoreable, and the escalation line
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=ct-head-acute-stroke; "onset 02:40, right hemiparesis; no haemorrhage, loss of left insular ribbon"'
    example_response: 'impression "Early left MCA territory ischaemia, ASPECTS 8. No haemorrhage."; escalate "stroke team now"'

  - id: ct-head-trauma
    purpose: Draft the CT head report for head injury, answering the surgical questions first.
    inputs: mechanism, GCS, anticoagulation status, findings
    outputs: findings, impression, and every traumatic lesion classified by type and size
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=ct-head-trauma; "RTA, GCS 12, on warfarin; left temporal extradural 14 mm"'
    example_response: 'impression "Left extradural haematoma 14 mm with 6 mm shift. Neurosurgical review now."'

  - id: ct-perfusion-stroke
    purpose: Draft a perfusion report separating core from penumbra for thrombectomy decisions.
    inputs: CTA/CTP findings, NIHSS, time from onset
    outputs: core volume, penumbra volume, mismatch ratio, and the decision-relevant summary
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=ct-perfusion-stroke; "CBF core 12 mL, Tmax>6 78 mL, M1 occlusion"'
    example_response: 'impression "Large mismatch (66 mL), M1 occlusion. Thrombectomy candidate."'

  - id: cta-head-neck
    purpose: Draft a CT angiogram report of the head and neck vessels.
    inputs: indication, findings on occlusion, stenosis, dissection, aneurysm
    outputs: findings by vessel, impression with the lesion that answers the question
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=cta-head-neck; "aphasia; left M1 cutoff, no stenosis internally"'
    example_response: 'impression "Left M1 occlusion. No significant extracranial stenosis."'

  - id: ct-chest-pulmonary-embolism
    purpose: Draft a CTPA report answering one question — is there a pulmonary embolus.
    inputs: clinical probability, findings by lobar level, right-heart measures
    outputs: positive or negative with the exact segmental level, and RV/LV ratio if given
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=ct-chest-pulmonary-embolism; "pleuritic pain, tachycardic; filling defect right lower lobar"'
    example_response: 'impression "Acute PE, right lower lobar and segmental. RV/LV 1.2, no strain."'

  - id: ct-chest-lung-nodule
    purpose: Draft a chest CT report with lung-RADS style nodule classification and follow-up interval.
    inputs: nodule size, density, location, prior imaging comparison
    outputs: characterised nodule list, category, and the interval or referral it implies
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=ct-chest-lung-nodule; "6 mm part-solid right upper lobe, new versus 2024"'
    example_response: 'impression "New 6 mm part-solid nodule RUL, category 4X — tissue or 3-month CT."'

  - id: ct-abdomen-acute
    purpose: Draft an acute abdominal CT report — appendicitis, diverticulitis, obstruction, ischaemia, perforation.
    inputs: pain history, findings, free fluid or gas, transition point
    outputs: the diagnosis the surgeon acts on, plus what was excluded
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=ct-abdomen-acute; "RLQ pain 18h; appendix 11 mm, appendicolith, fat stranding"'
    example_response: 'impression "Acute appendicitis with appendicolith. No perforation or collection."'

  - id: ct-abdomen-oncology-staging
    purpose: Draft a contrast CT staging report with measurable lesions and TNM-relevant findings.
    inputs: known primary, lesion measurements, nodal and visceral status
    outputs: measured lesion table in prose, staging-relevant impression, response comparison
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=ct-abdomen-oncology-staging; "colon CA, liver lesion 32 to 24 mm on chemo"'
    example_response: 'impression "Partial response; liver metastasis now 24 mm. No new disease."'

  - id: ct-spine-trauma
    purpose: Draft a cervical or thoracolumbar CT trauma report with a distraction-injury check.
    inputs: mechanism, findings by level, alignment, posterior element status
    outputs: fracture classification, stability comment, and the next imaging the findings demand
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=ct-spine-trauma; "fall from height; C6 anterior teardrop, prevertebral swelling"'
    example_response: 'impression "C6 teardrop fracture — unstable flexion-distraction. MRI and spine review."'

  # ---------------------------------------------------------------- 3. MRI (8)
  - id: mr-brain-tumour
    purpose: Draft a brain tumour MRI report with volumetric and mass-effect descriptors.
    inputs: symptoms, sequence findings, enhancement pattern, prior comparison
    outputs: lesion characterisation, differential, and what the neurosurgeon needs to plan
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=mr-brain-tumour; "seizures; 3.1 cm ring-enhancing left frontal lesion, 9 mm oedema"'
    example_response: 'impression "Ring-enhancing left frontal lesion — HGG vs metastasis. MR spectroscopy/perfusion."'

  - id: mr-brain-epilepsy
    purpose: Draft a protocolled epilepsy MRI report keyed to the surgical question.
    inputs: seizure semiology, hippocampal signal and volume, focal cortical dysplasia search
    outputs: lateralising findings, negative statements where nothing was seen
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=mr-brain-epilepsy; "left temporal epilepsy; right HC atrophy and T2 hyperintensity"'
    example_response: 'impression "Right hippocampal sclerosis, concordant with semiology."'

  - id: mr-brain-stroke
    purpose: Draft an acute MRI stroke report — diffusion-positive territory, age, haemorrhagic transformation.
    inputs: deficits, DWI/ADC/SWI findings, time from onset
    outputs: territory and age of infarcts, plus embolic-pattern comment
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=mr-brain-stroke; "vertigo; DWI bright left PCA territory, ADC dark"'
    example_response: 'impression "Acute left PCA infarct. No haemorrhagic transformation."'

  - id: mr-brain-dementia
    purpose: Draft a neurodegenerative MRI report with visual medial temporal atrophy scoring.
    inputs: cognitive history, atrophy pattern, white matter burden, ventriculometry
    outputs: pattern-based differential and the reversible causes excluded
    risk: moderate
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=mr-brain-dementia; "74F memory; MTA grade 3, Evans 0.34, disproportionate sulcal atrophy"'
    example_response: 'impression "Medial temporal atrophy out of proportion to hydrocephalus — NPH vs AD, clinical correlation."'

  - id: mr-cervical-spine-myelopathy
    purpose: Draft a cervical spine MRI report for suspected myelopathy, with cord signal and canal measures.
    inputs: upper-limb signs, cord signal change, canal diameter, level-by-level compression
    outputs: the compressive level, cord-change comment, and surgical relevance
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=mr-cervical-spine-myelopathy; "clumsy hands, Hoffmann C5-C6 disc-bar, canal 8 mm"'
    example_response: 'impression "C5-C6 severe stenosis with cord T2 signal — myelopathy, decompression."'

  - id: mr-lumbar-spine-radicular
    purpose: Draft a lumbar spine MRI report matched to the dermatome the clinician examined.
    inputs: dermatomal symptoms, disc and foraminal findings by level
    outputs: concordant-level statements first, incidental findings last
    risk: moderate
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=mr-lumbar-spine-radicular; "left S1 radiculopathy; L5-S1 left paracentral disc extrusion"'
    example_response: 'impression "L5-S1 left extruded disc compressing the traversing left S1 root — concordant."'

  - id: mr-joint-knee-shoulder
    purpose: Draft a knee or shoulder MRI report against the clinical test that prompted it.
    inputs: examination findings, sequence-by-sequence observations
    outputs: the structure that answers the clinical question, with grading
    risk: moderate
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=mr-joint-knee-shoulder; "Lachun positive; ACL absent fibres, PCL intact"'
    example_response: 'impression "Complete ACL tear. No meniscal tear. Orthopaedic review."'

  - id: mr-angiography-intracranial
    purpose: Draft an intracranial MRA/TOF report for aneurysm or stenosis screening.
    inputs: indication, vessel-by-vessel findings, aneurysm size and neck
    outputs: the vascular lesion with treatment-relevant anatomy
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=mr-angiography-intracranial; "headache; 4 mm AComm aneurysm, neck 2 mm"'
    example_response: 'impression "4 mm anterior communicating artery aneurysm. Neurosurgical assessment."'

  # ---------------------------------------------------------------- 4. Ultrasound (7)
  - id: us-abdomen
    purpose: Draft a general abdominal ultrasound report from dictated organ-by-organ findings.
    inputs: indication, organ findings, measurements given
    outputs: structured findings by organ, impression, and the next study if implied
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=us-abdomen; "RUQ pain; 8 mm mobile gallstone, wall 4 mm, sonographic Murphy positive"'
    example_response: 'impression "Acute calculous cholecystitis. Surgical referral."'

  - id: us-kidney-urinary
    purpose: Draft a renal and urinary bladder ultrasound report with hydronephrosis grading.
    inputs: indication, cortical thickness, collecting system, post-void residue
    outputs: graded obstruction, renal parenchymal comment, and the urological action
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=us-kidney-urinary; "rising creatinine; bilateral grade 3 hydronephrosis, prostate 62 mL"'
    example_response: 'impression "Bilateral high-grade obstruction, likely bladder outlet. Urgent decompression."'

  - id: us-liver-chronic-disease
    purpose: Draft a liver report addressing steatosis, fibrosis suspicion and focal lesions.
    inputs: liver function tests, echotexture, spleen size, varices if sought
    outputs: chronicity pattern, focal lesion characterisation, and cirrhosis-complication search
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=us-liver-chronic-disease; "thrombocytopenia; coarse echo pattern, spleen 14.2 cm, monophasic PV"'
    example_response: 'impression "Features of chronic liver disease with portal hypertension. HCC surveillance."'

  - id: us-thyroid
    purpose: Draft a thyroid ultrasound report with a TI-RADS style score and a biopsy or follow-up decision.
    inputs: nodule size, composition, echogenicity, calcification, laterocervical nodes
    outputs: scored nodule list and the size threshold that triggers FNA
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=us-thyroid; "13 mm hypoechoic solid nodule, microcalcifications, taller-than-wide"'
    example_response: 'impression "High-suspicion 13 mm nodule (TR5) — FNA indicated."'

  - id: us-breast-targeted
    purpose: Draft a targeted breast ultrasound report correlated with a mammographic or clinical finding.
    inputs: lump location, sonographic features, axillary nodes
    outputs: BI-RADS-style assessment and the tissue decision
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=us-breast-targeted; "left upper outer lump; 11 mm irregular shadowing mass, level I node abnormal"'
    example_response: 'impression "BI-RADS 5, 11 mm suspicious mass with abnormal axillary node — biopsy now."'

  - id: us-dvt-lower-limb
    purpose: Draft a lower-limb compression ultrasound report for suspected DVT.
    inputs: symptoms, extent, compressibility by segment
    outputs: proximal versus distal result, extent, and the treatment-relevant conclusion
    risk: high
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=us-dvt-lower-limb; "left calf swelling; femoral vein non-compressible"'
    example_response: 'impression "Acute proximal DVT, left femoral vein. Anticoagulate now."'

  - id: us-carotid-doppler
    purpose: Draft a carotid Doppler report with stenosis grading and a surgical or medical pathway.
    inputs: risk factors, peak velocities, plaque morphology, contralateral status
    outputs: NASCET-style grade, symptomatic-side identification, and next-step comment
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=us-carotid-doppler; "right amaurosis fugax; PSA 340, EDV 130 right ICA"'
    example_response: 'impression "Right ICA 70-99% symptomatic stenosis — endarterectomy assessment."'

  # ---------------------------------------------------------------- 5. Obstetric ultrasound (5)
  - id: us-obstetric-dating
    purpose: Draft a first-trimester dating and viability ultrasound report.
    inputs: last menstrual period, CRL, yolk sac, adnexa
    outputs: gestational age by CRL, discrepancy against dates, and viability statement
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=us-obstetric-dating; "LMP 7+4; single intrauterine pregnancy, CRL 11 mm"'
    example_response: 'impression "Single live IUP, 7 weeks 2 days by CRL. Agrees with dates."'

  - id: us-obstetric-anomaly
    purpose: Draft the mid-pregnancy anomaly scan report, organ by organ, with soft markers.
    inputs: gestation, biometry, system-by-system anatomy, placenta, liquor, cervix
    outputs: a complete negative survey plus any finding with its counselling implication
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=us-obstetric-anomaly; "19 weeks; ventriculomegaly 10.5 mm, otherwise normal"'
    example_response: 'impression "Borderline ventriculomegaly — targeted review, fetal medicine referral."'

  - id: us-obstetric-doppler
    purpose: Draft a feto-placental Doppler report for growth restriction surveillance.
    inputs: EFW centile, umbilical and MCA indices, ductus venosus, liquor
    outputs: staging-relevant Doppler pattern and the delivery-timing signal
    risk: critical
    approval: required
    audit: true
    capability: reasoning
    status: alpha
    example_request: 'skill=us-obstetric-doppler; "EFW 3rd centile, absent end-diastolic flow, CPR low"'
    example_response: 'impression "FGR with absent umbilical EDF — stage 2. Antenatal surveillance and steroids."'

  - id: us-nuchal-translucency
    purpose: Draft the NT screening report with the measurement quality the screening standard demands.
    inputs: gestation, CRL, NT thickness, visible anatomy
    outputs: NT value with its risk implication and the combined-screening handoff
    risk: high
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=us-nuchal-translucency; "CRL 62 mm, NT 3.4 mm, nasal bone present"'
    example_response: 'impression "Increased NT 3.4 mm — combined screening and fetal medicine referral."'

  - id: us-obstetric-growth
    purpose: Draft a growth-scan report with centiles and the interval to the next scan.
    inputs: biometry, EFW centile, liquor, Doppler if done
    outputs: growth trajectory comment and surveillance interval
    risk: moderate
    approval: required
    audit: true
    capability: default
    status: alpha
    example_request: 'skill=us-obstetric-growth; "32 weeks, EFW 8th centile, liquor normal"'
    example_response: 'impression "Small but stable, EFW 8th centile. Umbilical Doppler and 2-week review."'

  # ---------------------------------------------------------------- 6. X-ray and fluoroscopy (5)
  - id: xr-chest
    purpose: Draft a chest radiograph report addressing the acute question first.
    inputs: symptoms, projection, findings by structure, lines and tubes
    outputs: positive findings with a differential, and what is not seen
    risk: high
    approval: required
    audit: true
    capability: reasoning
    status: alpha
